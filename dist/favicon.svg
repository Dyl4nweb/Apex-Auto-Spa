<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1e38" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f0ff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Sleek Sports Car Silhouette -->
  <path d="M14 36 L21 23 C22.5 20.5 25 19 28 19 L36 19 C39 19 41.5 20.5 43 23 L50 36 C52 36.8 53 38.5 53 41 L53 45 C53 46.5 51.5 47.5 50 47.5 L48 47.5 C46.5 47.5 45 46.5 45 45 L45 44 L19 44 L19 45 C19 46.5 17.5 47.5 16 47.5 L14 47.5 C12.5 47.5 11 46.5 11 45 L11 41 C11 38.5 12 36.8 14 36 Z" 
        fill="none" 
        stroke="url(#cyanGrad)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Windshield Cutout -->
  <path d="M23 25 L41 25 L45 33 L19 33 Z" 
        fill="url(#cyanGrad)" 
        opacity="0.35" />

  <!-- Twin Glowing Headlights -->
  <circle cx="18" cy="39" r="2.5" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="46" cy="39" r="2.5" fill="#00f0ff" filter="url(#glow)"/>

  <!-- Golden Ceramic Star/Sparkle -->
  <polygon points="46,12 47.5,16 51.5,17.5 47.5,19 46,23 44.5,19 40.5,17.5 44.5,16" fill="#f59e0b"/>
</svg>
